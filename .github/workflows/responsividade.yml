name: Responsividade demos 4K

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 (action)
        with:
          bun-version: latest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Compilar demos Bun
        run: |
          bun install --frozen-lockfile
          bun run --cwd packages/demo build
      - name: Instalar navegador de teste estavel corrente
        run: | # zizmor: ignore[adhoc-packages] Suite web testa ultima versao estavel.
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --ignore-scripts --no-audit --no-fund playwright@latest
          node "$RUNNER_TEMP/pw/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Testar sete demos em 16 resolucoes
        run: |
          python3 -m http.server 4321 --bind 127.0.0.1 --directory packages/demo/dist &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node packages/demo/tests/responsividade.cjs
